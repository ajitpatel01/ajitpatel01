name: Update profile art

# Refreshes the contribution graph SVG daily from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install heatmap dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3 PyYAML==6.0.2

      - name: Fetch contribution data (GraphQL if token set)
        env:
          GH_PROFILE_USER: ajitpatel01
          # Classic PAT with read:user — includes private contribs to match logged-in profile.
          # Repo Settings → Secrets → Actions → PROFILE_GITHUB_TOKEN
          PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
